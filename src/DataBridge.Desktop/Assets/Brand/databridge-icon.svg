<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1024" height="1024" role="img" aria-labelledby="t">
  <title id="t">DataBridge</title>
  <!-- Database cylinder with an amber lightning bolt, on a primary-navy tile. -->
  <rect width="64" height="64" rx="14" fill="#0B2A4A"/>
  <!-- Cylinder bands run accent blue to sync teal under a light-blue cap. -->
  <path fill="#2563EB" d="M14,15 A18,6 0 0 0 50,15 V25 A18,6 0 0 1 14,25 Z"/>
  <path fill="#1D8FD0" d="M14,28 A18,6 0 0 0 50,28 V38 A18,6 0 0 1 14,38 Z"/>
  <path fill="#14B8A6" d="M14,41 A18,6 0 0 0 50,41 V50 A18,6 0 0 1 14,50 Z"/>
  <ellipse cx="32" cy="13" rx="18" ry="6" fill="#60A5FA"/>
  <!-- Lightning bolt: navy keyline cut out of the cylinder, amber fill. -->
  <path fill="#F59E0B" stroke="#0B2A4A" stroke-width="3" stroke-linejoin="round" paint-order="stroke"
        d="M34,17 H43 L37,30 H44 L27,58 L31,36 H24 Z"/>
