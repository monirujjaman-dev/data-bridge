name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore DataBridge.sln

      # Formatting is OS-independent; check it once.
      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format DataBridge.sln --verify-no-changes --no-restore

      # GitHub Actions sets CI=true, which turns on TreatWarningsAsErrors in Directory.Build.props.
      - name: Build
        run: dotnet build DataBridge.sln --configuration Release --no-restore -warnaserror

      # The credential-store tests use the real OS store. CI requires one, so a missing store fails the
      # run instead of skipping those tests. Linux runners have no Secret Service, so start one.
      - name: Install a Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gnome-keyring dbus-x11 libsecret-1-0

      - name: Test
        if: runner.os != 'Linux'
        env:
          DATABRIDGE_REQUIRE_CREDENTIAL_STORE: "true"
        run: dotnet test --solution DataBridge.sln --configuration Release --no-build

      - name: Test (in a D-Bus session with an unlocked keyring)
        if: runner.os == 'Linux'
        env:
          DATABRIDGE_REQUIRE_CREDENTIAL_STORE: "true"
        run: |
          dbus-run-session -- bash -c '
            printf "databridge-ci" | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            dotnet test --solution DataBridge.sln --configuration Release --no-build
          '
